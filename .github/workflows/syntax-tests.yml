name: Syntax Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-tests:
    name: Sublime Text (${{ matrix.build }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        build: [3211, stable, latest]
    steps:
      - uses: actions/checkout@v4
      - name: Verify spec alignment, sregex compatibility & 100% scope coverage
        run: ./scripts/verify.sh
      - uses: SublimeText/syntax-test-action@v2
        with:
          build: ${{ matrix.build }}
          package_name: Swift
